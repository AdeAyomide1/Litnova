name: litnova
description: LitNOVA - A free multi-format reading app

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.0.0

  # State management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

  # Networking
  dio: ^5.4.0
  http: ^1.1.0

  # HTML Parsing for scraping
  html: ^0.15.4
  flutter_widget_from_html: ^0.15.1

  # Local storage
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0

  # Text to speech (on-device, free)
  flutter_tts: ^4.0.2

  # Audio playback
  just_audio: ^0.9.36

  # Camera
  camera: ^0.10.5
  image_picker: ^1.0.7

  # Image viewing (comics/manga)
  photo_view: ^0.14.0

  # Auth
  google_sign_in: ^6.2.1

  # Push notifications
  firebase_core: ^2.24.0
  firebase_messaging: ^14.7.10

  # Fonts
  google_fonts: ^6.1.0

  # Utils
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  provider: ^6.1.5+1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
